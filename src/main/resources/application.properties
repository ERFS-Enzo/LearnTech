spring.application.name=learntech
spring.profiles.default=none
spring.liquibase.change-log=classpath:db/changelog/db.changelog-master.yaml
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.data.web.pageable.default-page-size=20
spring.data.web.pageable.max-page-size=100
springdoc.swagger-ui.operations-sorter=method
springdoc.swagger-ui.tags-sorter=alpha
app.admin-inicial.enabled=${INITIAL_ADMIN_ENABLED:false}
app.admin-inicial.nome=${INITIAL_ADMIN_NAME:}
app.admin-inicial.email=${INITIAL_ADMIN_EMAIL:}
app.admin-inicial.cpf=${INITIAL_ADMIN_CPF:}
app.admin-inicial.login=${INITIAL_ADMIN_LOGIN:}
app.admin-inicial.senha=${INITIAL_ADMIN_PASSWORD:}
app.security.jwt.secret=${JWT_SECRET}
app.security.jwt.issuer=learntech
app.security.jwt.expiration=PT30M
app.security.refresh.idle-timeout=PT30M
app.security.refresh.absolute-timeout=PT8H