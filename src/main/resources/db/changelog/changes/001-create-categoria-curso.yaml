databaseChangeLog:
  - changeSet:
      id: 001-01-create-categoria-curso
      author: enzo-curso-spring-2026
      comment: Cria a tabela que classifica os cursos.
      changes:
        - createTable:
            tableName: categoria_curso
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    primaryKeyName: pk_categoria_curso
                    nullable: false
              - column:
                  name: nome
                  type: VARCHAR(120)
                  constraints:
                    nullable: false
              - column:
                  name: status
                  type: VARCHAR(20)
                  constraints:
                    nullable: false
      rollback:
        - dropTable:
            tableName: categoria_curso

  - changeSet:
      id: 001-02-check-status-categoria-curso
      author: enzo-curso-spring-2026
      comment: Restringe o status aos valores definidos no enum Java.
      changes:
        - sql:
            sql: >
              ALTER TABLE categoria_curso
              ADD CONSTRAINT ck_categoria_curso_status
              CHECK (status IN ('ATIVO', 'INATIVO'))
      rollback:
        - sql:
            sql: >
              ALTER TABLE categoria_curso
              DROP CONSTRAINT ck_categoria_curso_status