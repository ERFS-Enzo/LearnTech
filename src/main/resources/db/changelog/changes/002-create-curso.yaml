databaseChangeLog:
  - changeSet:
      id: 002-01-create-curso
      author: enzo-curso-spring-2026
      changes:
        - createTable:
            tableName: curso
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    primaryKeyName: pk_curso
                    nullable: false
              - column:
                  name: codigo_curso
                  type: int
                  constraints:
                    nullable: false
              - column:
                  name: descricao
                  type: VARCHAR(150)
                  constraints:
                    nullable: false
              - column:
                  name: carga_horaria
                  type: NUMERIC(18,3)
                  constraints:
                    nullable: false
              - column:
                  name: valor_curso
                  type: NUMERIC(18,2)
                  constraints:
                    nullable: false
              - column:
                  name: data_cadastro
                  type: DATE
                  constraints:
                    nullable: false
              - column:
                  name: status
                  type: VARCHAR(20)
                  constraints:
                    nullable: false
              - column:
                  name: categoria_curso_id
                  type: BIGINT
                  constraints:
                    nullable: false
      rollback:
        - dropTable:
            tableName: curso

  - changeSet:
      id: 002-02-unique-codigo_curso
      author: enzo-curso-spring-2026
      changes:
        - addUniqueConstraint:
            tableName: curso
            columnNames: codigo_curso
            constraintName: uk_curso_codigo_curso
      rollback:
        - dropUniqueConstraint:
            tableName: curso
            constraintName: uk_curso_codigo_curso

  - changeSet:
      id: 002-03-foreign-key-categoria_curso
      author: enzo-curso-spring-2026
      changes:
        - addForeignKeyConstraint:
            baseTableName: curso
            baseColumnNames: categoria_curso_id
            referencedTableName: categoria_curso
            referencedColumnNames: id
            constraintName: fk_curso_categoria_curso
            onDelete: RESTRICT
      rollback:
        - dropForeignKeyConstraint:
            baseTableName: curso
            constraintName: fk_curso_categoria_curso

  - changeSet:
      id: 002-04-check-carga-horaria
      author: enzo-curso-spring-2026
      changes:
        - sql:
            sql: >
              ALTER TABLE curso
              ADD CONSTRAINT ck_curso_carga_horaria
              CHECK (carga_horaria >= 0)
      rollback:
        - sql:
            sql: ALTER TABLE curso DROP CONSTRAINT ck_curso_carga_horaria

  - changeSet:
      id: 002-05-check-valor-curso
      author: enzo-curso-spring-2026
      changes:
        - sql:
            sql: >
              ALTER TABLE curso
              ADD CONSTRAINT ck_curso_valor_curso
              CHECK (valor_curso >= 0)
      rollback:
        - sql:
            sql: ALTER TABLE curso DROP CONSTRAINT ck_curso_valor_curso

  - changeSet:
      id: 002-06-check-status-curso
      author: enzo-curso-spring-2026
      changes:
        - sql:
            sql: >
              ALTER TABLE curso
              ADD CONSTRAINT ck_curso_status
              CHECK (status IN ('ATIVO', 'INATIVO'))
      rollback:
        - sql:
            sql: ALTER TABLE curso DROP CONSTRAINT ck_curso_status