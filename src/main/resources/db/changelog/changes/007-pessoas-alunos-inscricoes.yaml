databaseChangeLog:
  - changeSet:
      id: 007-01-add-vagas-disponiveis-curso
      author: enzo
      comment: Vagas consumidas ao finalizar uma inscrição. Cursos existentes começam com zero.
      changes:
        - addColumn:
            tableName: curso
            columns:
              - column:
                  name: vagas_disponiveis
                  type: INTEGER
                  defaultValueNumeric: 0
                  constraints:
                    nullable: false

  - changeSet:
      id: 007-02-check-vagas-disponiveis-curso
      author: enzo
      changes:
        - sql:
            sql: ALTER TABLE curso ADD CONSTRAINT chk_curso_vagas_disponiveis CHECK (vagas_disponiveis >= 0)
      rollback:
        - sql:
            sql: ALTER TABLE curso DROP CONSTRAINT chk_curso_vagas_disponiveis

  - changeSet:
      id: 007-03-create-table-pessoa
      author: enzo
      comment: Identidade civil única. Papéis (aluno, colaborador) referenciam esta tabela.
      changes:
        - createTable:
            tableName: pessoa
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    primaryKeyName: pk_pessoa
              - column:
                  name: nome
                  type: VARCHAR(150)
                  constraints:
                    nullable: false
              - column:
                  name: email
                  type: VARCHAR(150)
                  constraints:
                    nullable: false
              - column:
                  name: cpf
                  type: VARCHAR(11)
                  constraints:
                    nullable: false
              - column:
                  name: data_cadastro
                  type: DATE
                  constraints:
                    nullable: false
              - column:
                  name: status
                  type: VARCHAR(20)
                  constraints:
                    nullable: false

  - changeSet:
      id: 007-04-constraints-pessoa
      author: enzo
      changes:
        - addUniqueConstraint:
            tableName: pessoa
            columnNames: cpf
            constraintName: uk_pessoa_cpf
        - sql:
            sql: CREATE UNIQUE INDEX uk_pessoa_email_lower ON pessoa (LOWER(email))
        - sql:
            sql: ALTER TABLE pessoa ADD CONSTRAINT chk_pessoa_status CHECK (status IN ('ATIVO', 'INATIVO'))
        - sql:
            sql: ALTER TABLE pessoa ADD CONSTRAINT chk_pessoa_cpf_formato CHECK (cpf ~ '^[0-9]{11}$')
      rollback:
        - sql:
            sql: ALTER TABLE pessoa DROP CONSTRAINT chk_pessoa_cpf_formato
        - sql:
            sql: ALTER TABLE pessoa DROP CONSTRAINT chk_pessoa_status
        - sql:
            sql: DROP INDEX uk_pessoa_email_lower
        - dropUniqueConstraint:
            tableName: pessoa
            constraintName: uk_pessoa_cpf

  - changeSet:
      id: 007-05-create-table-aluno
      author: enzo
      changes:
        - createTable:
            tableName: aluno
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    primaryKeyName: pk_aluno
              - column:
                  name: pessoa_id
                  type: BIGINT
                  constraints:
                    nullable: false
              - column:
                  name: telefone
                  type: VARCHAR(30)
        - addUniqueConstraint:
            tableName: aluno
            columnNames: pessoa_id
            constraintName: uk_aluno_pessoa
        - addForeignKeyConstraint:
            baseTableName: aluno
            baseColumnNames: pessoa_id
            referencedTableName: pessoa
            referencedColumnNames: id
            constraintName: fk_aluno_pessoa
            onDelete: RESTRICT

  - changeSet:
      id: 007-06-create-table-colaborador
      author: enzo
      changes:
        - createTable:
            tableName: colaborador
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    primaryKeyName: pk_colaborador
              - column:
                  name: pessoa_id
                  type: BIGINT
                  constraints:
                    nullable: false
              - column:
                  name: matricula
                  type: VARCHAR(30)
                  constraints:
                    nullable: false
              - column:
                  name: funcao
                  type: VARCHAR(30)
                  constraints:
                    nullable: false
              - column:
                  name: data_admissao
                  type: DATE
                  constraints:
                    nullable: false
        - addUniqueConstraint:
            tableName: colaborador
            columnNames: pessoa_id
            constraintName: uk_colaborador_pessoa
        - addUniqueConstraint:
            tableName: colaborador
            columnNames: matricula
            constraintName: uk_colaborador_matricula
        - addForeignKeyConstraint:
            baseTableName: colaborador
            baseColumnNames: pessoa_id
            referencedTableName: pessoa
            referencedColumnNames: id
            constraintName: fk_colaborador_pessoa
            onDelete: RESTRICT
        - sql:
            sql: ALTER TABLE colaborador ADD CONSTRAINT chk_colaborador_funcao CHECK (funcao IN ('ATENDENTE', 'COORDENADOR', 'SUPORTE', 'FINANCEIRO'))
      rollback:
        - dropTable:
            tableName: colaborador

  - changeSet:
      id: 007-07-create-table-inscricao
      author: enzo
      changes:
        - createTable:
            tableName: inscricao
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    primaryKeyName: pk_inscricao
              - column:
                  name: aluno_id
                  type: BIGINT
                  constraints:
                    nullable: false
              - column:
                  name: atendente_id
                  type: BIGINT
                  constraints:
                    nullable: false
              - column:
                  name: status
                  type: VARCHAR(20)
                  constraints:
                    nullable: false
              - column:
                  name: data_abertura
                  type: TIMESTAMP
                  constraints:
                    nullable: false
              - column:
                  name: data_finalizacao
                  type: TIMESTAMP
        - addForeignKeyConstraint:
            baseTableName: inscricao
            baseColumnNames: aluno_id
            referencedTableName: aluno
            referencedColumnNames: id
            constraintName: fk_inscricao_aluno
            onDelete: RESTRICT
        - addForeignKeyConstraint:
            baseTableName: inscricao
            baseColumnNames: atendente_id
            referencedTableName: colaborador
            referencedColumnNames: id
            constraintName: fk_inscricao_atendente
            onDelete: RESTRICT
        - sql:
            sql: ALTER TABLE inscricao ADD CONSTRAINT chk_inscricao_status CHECK (status IN ('ABERTA', 'FINALIZADA', 'CANCELADA'))
        - sql:
            sql: ALTER TABLE inscricao ADD CONSTRAINT chk_inscricao_finalizacao CHECK ((status = 'FINALIZADA' AND data_finalizacao IS NOT NULL) OR (status <> 'FINALIZADA' AND data_finalizacao IS NULL))
      rollback:
        - dropTable:
            tableName: inscricao

  - changeSet:
      id: 007-08-create-table-item-inscricao
      author: enzo
      comment: Entidade associativa entre inscrição e curso, com o valor praticado na época.
      changes:
        - createTable:
            tableName: item_inscricao
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    primaryKeyName: pk_item_inscricao
              - column:
                  name: inscricao_id
                  type: BIGINT
                  constraints:
                    nullable: false
              - column:
                  name: curso_id
                  type: BIGINT
                  constraints:
                    nullable: false
              - column:
                  name: valor_praticado
                  type: NUMERIC(18,2)
                  constraints:
                    nullable: false
        - addUniqueConstraint:
            tableName: item_inscricao
            columnNames: inscricao_id, curso_id
            constraintName: uk_item_inscricao_curso
        - addForeignKeyConstraint:
            baseTableName: item_inscricao
            baseColumnNames: inscricao_id
            referencedTableName: inscricao
            referencedColumnNames: id
            constraintName: fk_item_inscricao_inscricao
            onDelete: RESTRICT
        - addForeignKeyConstraint:
            baseTableName: item_inscricao
            baseColumnNames: curso_id
            referencedTableName: curso
            referencedColumnNames: id
            constraintName: fk_item_inscricao_curso
            onDelete: RESTRICT
        - sql:
            sql: ALTER TABLE item_inscricao ADD CONSTRAINT chk_item_inscricao_valor CHECK (valor_praticado >= 0)
      rollback:
        - dropTable:
            tableName: item_inscricao