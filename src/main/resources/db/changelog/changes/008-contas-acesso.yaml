databaseChangeLog:
  - changeSet:
      id: 008-01-contas-acesso
      author: learntech
      changes:
        - sql:
            sql: |
              CREATE TABLE conta_acesso (
                  id BIGINT GENERATED BY DEFAULT AS IDENTITY PRIMARY KEY,
                  pessoa_id BIGINT NOT NULL UNIQUE,
                  login VARCHAR(80) NOT NULL UNIQUE,
                  senha_hash VARCHAR(255) NOT NULL,
                  ativa BOOLEAN NOT NULL DEFAULT TRUE,
                  CONSTRAINT fk_conta_pessoa
                    FOREIGN KEY (pessoa_id) REFERENCES pessoa(id)
                    ON DELETE RESTRICT,
                  CONSTRAINT chk_conta_login
                    CHECK (login = LOWER(BTRIM(login)) AND login <> '')
              );

              CREATE TABLE conta_acesso_perfil (
                  conta_id BIGINT NOT NULL,
                  perfil VARCHAR(30) NOT NULL,
                  PRIMARY KEY (conta_id, perfil),
                  CONSTRAINT fk_perfil_conta
                    FOREIGN KEY (conta_id) REFERENCES conta_acesso(id)
                    ON DELETE CASCADE,
                  CONSTRAINT chk_perfil_acesso
                    CHECK (perfil IN ('OPERADOR', 'ADMINISTRADOR'))
              );
      rollback:
        - sql:
            sql: |
              DROP TABLE conta_acesso_perfil;
              DROP TABLE conta_acesso;