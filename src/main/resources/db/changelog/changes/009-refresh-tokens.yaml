databaseChangeLog:
  - changeSet:
      id: 009-01-refresh-tokens
      author: learntech
      changes:
        - sql:
            sql: |
              CREATE TABLE sessao_refresh_token (
                  id BIGINT GENERATED BY DEFAULT AS IDENTITY PRIMARY KEY,
                  conta_id BIGINT NOT NULL,
                  familia UUID NOT NULL,
                  token_hash VARCHAR(64) NOT NULL UNIQUE,
                  expira_em TIMESTAMP WITH TIME ZONE NOT NULL,
                  expiracao_absoluta TIMESTAMP WITH TIME ZONE NOT NULL,
                  usada BOOLEAN NOT NULL DEFAULT FALSE,
                  revogada BOOLEAN NOT NULL DEFAULT FALSE,
                  CONSTRAINT fk_refresh_conta
                    FOREIGN KEY (conta_id) REFERENCES conta_acesso(id)
                    ON DELETE CASCADE,
                  CONSTRAINT chk_refresh_expiracao
                    CHECK (expira_em <= expiracao_absoluta)
              );

              CREATE INDEX ix_refresh_conta
                ON sessao_refresh_token(conta_id);

              CREATE INDEX ix_refresh_familia
                ON sessao_refresh_token(familia);
      rollback:
        - sql:
            sql: DROP TABLE sessao_refresh_token;