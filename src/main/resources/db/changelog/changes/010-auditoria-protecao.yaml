databaseChangeLog:
  - changeSet:
      id: 010-01-protecao-login
      author: learntech
      changes:
        - sql:
            sql: |
              CREATE TABLE protecao_login (
                  chave VARCHAR(64) PRIMARY KEY,
                  falhas INTEGER NOT NULL DEFAULT 0,
                  janela_iniciada_em TIMESTAMP WITH TIME ZONE,
                  bloqueado_ate TIMESTAMP WITH TIME ZONE,
                  CONSTRAINT chk_protecao_falhas CHECK (falhas >= 0)
              );

              CREATE TABLE evento_seguranca (
                  id BIGINT GENERATED BY DEFAULT AS IDENTITY PRIMARY KEY,
                  ocorrido_em TIMESTAMP WITH TIME ZONE NOT NULL,
                  tipo VARCHAR(60) NOT NULL,
                  ator_id BIGINT,
                  alvo_id BIGINT,
                  chave_login VARCHAR(64),
                  origem VARCHAR(64)
              );

              CREATE INDEX ix_evento_seguranca_data
                ON evento_seguranca(ocorrido_em);

              CREATE INDEX ix_evento_seguranca_tipo
                ON evento_seguranca(tipo);
      rollback:
        - sql:
            sql: |
              DROP TABLE evento_seguranca;
              DROP TABLE protecao_login;